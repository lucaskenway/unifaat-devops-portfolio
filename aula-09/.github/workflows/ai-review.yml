name: AI Code Review — Aula 09

# Só em Pull Requests: push direto na main é responsabilidade do CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # postar/atualizar o comentário do review

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: necessário para o git diff base...head

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obter diff do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=3 "$BASE_SHA...$HEAD_SHA" > /tmp/pr-diff.txt
          echo "Arquivos alterados:"
          git diff --name-only "$BASE_SHA...$HEAD_SHA"
          echo "Tamanho do diff: $(wc -l < /tmp/pr-diff.txt) linhas"

      - name: Executar análise de código
        id: analysis
        env:
          DIFF_FILE: /tmp/pr-diff.txt
          REVIEW_OUTPUT: /tmp/ai-review-result.md
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ai-review.js

      # Atualiza o comentário existente em vez de criar um novo a cada push no PR
      - name: Postar ou atualizar comentário no PR
        if: always() && steps.analysis.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- technova-ai-review -->';
            const path = '/tmp/ai-review-result.md';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `${marker}\n## 🤖 AI Code Review — TechNova\n\n⚠️ A análise falhou antes de gerar o relatório. Veja os logs do workflow.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              core.info(`Comentário atualizado: ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              core.info(`Comentário criado: ${data.html_url}`);
            }

      # CRITICAL → job falha → check vermelho no PR (bloqueia o merge com branch protection)
      # Só WARNING/INFO → job passa
      - name: Quality gate
        env:
          CRITICAL: ${{ steps.analysis.outputs.critical }}
          WARNING: ${{ steps.analysis.outputs.warning }}
          INFO: ${{ steps.analysis.outputs.info }}
        run: |
          echo "CRITICAL=$CRITICAL WARNING=$WARNING INFO=$INFO"
          if [ "${CRITICAL:-0}" -gt 0 ]; then
            echo "::error title=Quality gate::$CRITICAL achado(s) CRITICAL — PR bloqueado até a correção."
            exit 1
          fi
          echo "✅ Quality gate aprovado (sem CRITICAL)."
