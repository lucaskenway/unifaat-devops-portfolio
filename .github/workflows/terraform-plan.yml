name: Terraform Plan — Aula 10

# GitOps: toda mudança de infraestrutura entra por PR. Este workflow roda
# fmt → init → validate → plan e posta o resultado como comentário no PR
# (um único comentário, atualizado a cada novo push). Se o plan falhar, o check
# fica vermelho e a branch protection impede o merge.
#
# Autenticação: credenciais TEMPORÁRIAS de sessão do AWS Academy Learner Lab
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN como secrets).
# Em produção isto seria OIDC + role IAM (role-to-assume, sem chaves), mas o Lab
# não permite criar OIDC provider nem roles IAM.

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: reavalia o gate de destroy quando a label allow-destroy muda
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'aula-10/terraform/**.tf'
      - 'aula-10/terraform/**.tfvars'
      - 'aula-10/terraform/user_data.sh'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-aula10-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # Learner Lab exige
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # sem o wrapper: o output é capturado em arquivo para o comentário
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        id: init
        # bucket do state = technova-tfstate-<ACCOUNT_ID> (conta do Lab muda entre sessões)
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=technova-tfstate-$(aws sts get-caller-identity --query Account --output text)"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # continue-on-error: o output vai para o comentário mesmo quando o plan falha
      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      # Conta quantos recursos o plan vai DESTRUIR (inclui replace = destroy + create)
      - name: Detectar destroy no plan
        id: destroy
        if: steps.plan.outcome == 'success'
        run: |
          COUNT=$(terraform show -json tfplan \
            | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Recursos a destruir: $COUNT"

      - name: Postar Plan como comentário no PR
        uses: actions/github-script@v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          DESTROY_COUNT: ${{ steps.destroy.outputs.count || '0' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- terraform-plan-aula10 -->';
            const MAX = 60000; // limite de ~65k caracteres do corpo de um comentário

            let plan = fs.readFileSync(`${process.env.TF_WORKING_DIR}/plan.txt`, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(sem resumo — veja o log)'])[0];
            if (plan.length > MAX) {
              plan = plan.slice(-MAX) + '\n\n... (output truncado — veja o log completo do workflow)';
            }

            const icon = (o) => (o === 'success' ? '✅' : '❌');
            const destroys = Number(process.env.DESTROY_COUNT);
            const destroyLine = destroys > 0
              ? `\n> ⚠️ **Este plan DESTRÓI ${destroys} recurso(s).** O merge só é liberado com a label \`allow-destroy\` no PR.\n`
              : '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `${MARKER}
            #### Terraform Plan 📖 — \`aula-10/terraform\`

            | Etapa | Resultado |
            |-------|-----------|
            | 🖌 Format (\`fmt -check\`) | ${icon(process.env.FMT)} \`${process.env.FMT}\` |
            | ⚙️ Init | ${icon(process.env.INIT)} \`${process.env.INIT}\` |
            | 🤖 Validate | ${icon(process.env.VALIDATE)} \`${process.env.VALIDATE}\` |
            | 📖 Plan | ${icon(process.env.PLAN)} \`${process.env.PLAN}\` |

            **${summary}**
            ${destroyLine}
            <details><summary>Mostrar o plan completo</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · por @${context.actor} · [execução](${runUrl})*`;

            // Atualiza o comentário existente em vez de criar um novo a cada push
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.includes(MARKER));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Falhar se fmt ou plan falharam
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "::error::fmt=${{ steps.fmt.outcome }} plan=${{ steps.plan.outcome }} — corrija antes do merge"
          exit 1

      # Aprovação extra para destroy: sem a label allow-destroy o check falha
      - name: Gate de destroy
        if: steps.destroy.outcome == 'success' && steps.destroy.outputs.count != '0' &&!contains(github.event.pull_request.labels.*.name, 'allow-destroy')
        run: |
          echo "::error::O plan destrói ${{ steps.destroy.outputs.count }} recurso(s). Revise e adicione a label 'allow-destroy' ao PR para liberar."
          exit 1
