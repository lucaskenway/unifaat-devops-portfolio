name: CI Pipeline — Aula 09

# push na main  → lint → test → build → push ECR (sha-XXXXXXX + latest)
# push de tag   → lint → test → build → push ECR (1.2.3, 1.2, 1 + sha-XXXXXXX)
# pull request  → lint → test → build (SEM push para o registry)
#
# O push no Amazon ECR usa as credenciais TEMPORÁRIAS do AWS Academy Learner Lab
# (secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN). Elas expiram a
# cada sessão do Lab: quando estão ausentes ou vencidas o push é pulado com aviso e o fluxo
# confiável é o script local aula-09/technova-api/ecr-push.sh.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - 'aula-09/technova-api/**'
      - '.github/workflows/ci-aula09.yml'
  workflow_dispatch:

# PRs: cancela execuções antigas do mesmo PR. main/tags: nunca interrompe um push em andamento
concurrency:
  group: ci-aula09-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_DIR: aula-09/technova-api
  AWS_REGION: us-east-1
  ECR_REPOSITORY: technova-api

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-09/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Tests (Jest)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-09/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aula09
          path: aula-09/technova-api/coverage/
          retention-days: 14

  build-and-push:
    name: Build & Push (Amazon ECR)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (carregado no daemon) para o smoke test, com cache de layers no GitHub Actions
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: technova-api:ci
          cache-from: type=gha,scope=technova-api
          cache-to: type=gha,mode=max,scope=technova-api

      - name: Smoke test do container
        run: |
          docker run -d --name smoke -p 3000:3000 technova-api:ci
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo
              echo "✅ Health check OK"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Health check falhou"
          docker logs smoke
          exit 1

      - name: Remover container de teste
        if: always()
        run: docker rm -f smoke || true

      # Push condicional: só em push para main/tags e só com uma sessão do Lab válida.
      # Em PR a imagem é construída e testada, mas não publicada.
      - name: Verificar credenciais do Learner Lab
        id: lab
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SESSION_TOKEN" ]; then
            echo "::warning title=ECR::Secrets do Learner Lab não configurados — push no ECR pulado (use ecr-push.sh)"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          elif aws sts get-caller-identity --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=ECR::Credenciais do Learner Lab expiradas — atualize os 3 secrets ou use ecr-push.sh"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar credenciais AWS (Learner Lab)
        if: steps.lab.outputs.valid == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        if: steps.lab.outputs.valid == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Garantir o repositório ECR
        if: steps.lab.outputs.valid == 'true'
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

      - name: Extrair metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry || 'ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com' }}/${{ env.ECR_REPOSITORY }}
          tags: |
            # sha-XXXXXXX em todo build (rastreabilidade: imagem ↔ commit)
            type=sha,prefix=sha-,format=short
            # latest só na branch padrão (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # git tag v1.2.3 → 1.2.3, 1.2 e 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # As layers já estão no cache, então este passo só reaproveita e envia
      - name: Push para o Amazon ECR
        if: steps.lab.outputs.valid == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=technova-api

      - name: Resumo
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ steps.lab.outputs.valid == 'true' }}
        run: |
          {
            echo "## 🐳 TechNova API — imagem Docker"
            echo
            if [ "$PUSHED" = "true" ]; then
              echo "Publicada no **Amazon ECR** (\`$AWS_REGION\`) com as tags:"
            elif [ "$EVENT" = "pull_request" ]; then
              echo "Build de **Pull Request** — imagem construída e testada, **não publicada**. Tags que seriam geradas:"
            else
              echo "Imagem construída e testada, mas **não publicada**: sessão do Learner Lab ausente/expirada. Publique com \`aula-09/technova-api/ecr-push.sh\`. Tags que seriam geradas:"
            fi
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
