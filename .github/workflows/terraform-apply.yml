name: Terraform Apply — Aula 10

# GitOps: o merge na main é a aprovação humana do plan revisado no PR.
# Este workflow aplica exatamente o código que entrou na main, sem ninguém
# rodar Terraform na própria máquina.
#
# Autenticação: credenciais de sessão do Learner Lab (3 secrets). Em produção
# seria OIDC + role IAM — indisponível no Lab.

on:
  push:
    branches: [main]
    paths:
      - 'aula-10/terraform/**.tf'
      - 'aula-10/terraform/**.tfvars'
      - 'aula-10/terraform/user_data.sh'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

# Nunca cancela um apply no meio; applies seguidos entram na fila
concurrency:
  group: terraform-aula10
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # Learner Lab exige
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        # bucket do state = technova-tfstate-<ACCOUNT_ID> (conta do Lab muda entre sessões)
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=technova-tfstate-$(aws sts get-caller-identity --query Account --output text)"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color

      - name: Outputs
        run: |
          terraform output -no-color
          {
            echo "## 🏗️ Terraform Apply — aula-10/terraform"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` aplicado com sucesso."
            echo
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
