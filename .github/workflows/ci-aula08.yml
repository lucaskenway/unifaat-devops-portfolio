name: CI Pipeline — Aula 08

on:
  push:
    branches: [main]
    paths:
      - 'aula-08/technova-api/**'
      - '.github/workflows/ci-aula08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aula-08/technova-api/**'
      - '.github/workflows/ci-aula08.yml'
  workflow_dispatch:

# B4 — cancela execuções anteriores da mesma branch/PR ainda em andamento
concurrency:
  group: ci-aula08-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aula-08/technova-api

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: aula-08/technova-api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('aula-08/technova-api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Tests (Jest) — Node ${{ matrix.node-version }}
    needs: lint
    runs-on: ubuntu-latest

    # B1 — testes em Node 18 e Node 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # B2 — cache das dependências npm
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always() && matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: aula-08/technova-api/coverage/
          retention-days: 14

  build:
    name: Build (Docker)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # R5 — secrets referenciados no workflow (valores ficam mascarados no log)
      - name: Verificar secrets configurados
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "❌ Secret AWS_REGION não configurado"
            exit 1
          fi
          echo "✅ AWS_REGION carregada: $AWS_REGION"
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "✅ AWS_ACCESS_KEY_ID está configurada"
          else
            echo "⚠️ AWS_ACCESS_KEY_ID não configurada (opcional)"
          fi

      - name: Build da imagem Docker
        run: docker build -t technova-api:${{ github.sha }} .

      - name: Verificar imagem criada
        run: docker images technova-api

      # B5 — smoke test: sobe o container, checa /health e remove
      - name: Smoke test do container
        run: |
          docker run -d --name test-container -p 3000:3000 technova-api:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health; then
              echo
              echo "✅ Health check OK"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "❌ Health check falhou"
              docker logs test-container
              exit 1
            fi
            sleep 2
          done

      - name: Remover container de teste
        if: always()
        run: docker rm -f test-container || true

  verify-credentials:
    name: Verify Credentials
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Job sem checkout: sobrescreve o working-directory global, que não existe aqui
    defaults:
      run:
        working-directory: .

    steps:
      - name: Verificar configuração AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Verificando credenciais AWS..."
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "✅ Credenciais AWS configuradas"
            echo "Região: $AWS_DEFAULT_REGION"
          else
            echo "❌ Credenciais AWS NÃO configuradas"
            exit 1
          fi

  # B3 — comenta o resultado do CI no Pull Request
  pr-comment:
    name: Comentar resultado no PR
    needs: [lint, test, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comentar no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const results = {
              'Lint (ESLint)': '${{ needs.lint.result }}',
              'Tests (Jest)': '${{ needs.test.result }}',
              'Build (Docker)': '${{ needs.build.result }}'
            };
            const ok = Object.values(results).every(r => r === 'success');
            const rows = Object.entries(results)
              .map(([job, r]) => `| ${job} | ${icon(r)} ${r} |`)
              .join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ${ok ? '✅ CI passou' : '❌ CI falhou'} — Aula 08`,
              '',
              '| Job | Resultado |',
              '|-----|-----------|',
              rows,
              '',
              `Commit: \`${context.sha.substring(0, 7)}\` · [Ver execução](${runUrl})`
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const previous = comments.find(c => c.body.includes('— Aula 08'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }
